<div class="bg-surface text-on-surface antialiased min-h-screen">
  <!-- TopAppBar -->
  <header
    class="sticky top-0 z-40 bg-surface/90 backdrop-blur-md flex justify-between items-center w-full px-6 py-4"
  >
    <div class="flex items-center gap-3">
      <button
        type="button"
        class="inline-flex items-center justify-center"
        aria-label="Abrir menu"
        (click)="toggleMenu()"
      >
        <span
          class="material-symbols-outlined text-primary scale-110 active:scale-95 transition-transform cursor-pointer"
          >menu</span
        >
      </button>
      <h1
        class="!text-2xl !font-black italic tracking-tighter text-primary !leading-none !m-0"
      >
        Triluga
      </h1>
    </div>
    <div class="flex items-center gap-4">
      <button
        type="button"
        class="inline-flex items-center justify-center"
        aria-label="Abrir notificações"
        (click)="toggleNotifications()"
      >
        <span
          class="material-symbols-outlined text-on-surface-variant scale-110 active:scale-95 transition-transform cursor-pointer"
          >notifications</span
        >
      </button>
    </div>
  </header>
  <main class="pb-36">
    <!-- Compact Search & Filter Bar -->
    <section class="px-5 pt-4 mb-4">
      <div class="flex gap-2 items-center">
        <div
          class="flex-1 bg-surface-container-low rounded-xl px-4 flex items-center gap-3 border border-outline-variant/20 shadow-sm"
          style="height: 50px"
        >
          <span class="material-symbols-outlined text-outline text-lg"
            >search</span
          >
          <input
            class="bg-transparent border-none focus:ring-0 text-sm font-medium w-full text-on-surface placeholder:text-on-surface-variant/60"
            placeholder="Buscar por modelo ou marca"
            type="text"
            [value]="query.q || query.city"
            (keydown.enter)="onSearch({ q: $any($event.target).value })"
            style="
              height: 100%;
              border: none;
              padding: 0;
              margin: 0;
              outline: none;
              box-shadow: none;
            "
          />
        </div>
        <button
          class="bg-primary text-on-primary rounded-xl flex items-center justify-center shadow-md shadow-primary/20 active:scale-95 transition-transform"
          (click)="filtersOpen = true"
          style="width: 45px; height: 45px"
        >
          <span class="material-symbols-outlined text-xl">tune</span>
        </button>
      </div>
    </section>
    <!-- Refined Active Filter Chips -->
    <section
      class="px-5 mb-5 overflow-x-auto no-scrollbar"
      *ngIf="activeSearchPills.length > 0"
    >
      <div class="flex gap-2 whitespace-nowrap">
        <div
          *ngFor="let pill of activeSearchPills"
          class="bg-surface-container-high text-on-surface-variant px-3 py-1.5 rounded-full text-[11px] font-semibold flex items-center gap-1.5 border border-outline-variant/30"
          (click)="removeFilter(pill.key)"
        >
          {{ pill.label }}
          <span class="material-symbols-outlined text-xs">close</span>
        </div>
      </div>
    </section>
    <!-- Result Counter -->
    <section class="px-5 mb-4 flex justify-between items-center">
      <h2
        class="search-result-count text-on-surface font-extrabold tracking-tight leading-none whitespace-nowrap overflow-hidden text-ellipsis mr-2"
      >
        {{ totalItems }} {{ resultsLabel }}
      </h2>
      <div
        class="flex items-center flex-shrink-0 gap-1 font-bold text-primary uppercase tracking-widest bg-primary/5 px-2 py-1 rounded"
        style="font-size: 10px"
      >
        <span>Relevância</span>
        <span class="material-symbols-outlined text-xs">expand_more</span>
      </div>
    </section>

    <!-- Vehicle List -->
    <section class="px-5 space-y-6">
      <app-vehicle-card
        *ngFor="let vehicle of vehicles"
        [vehicle]="vehicle"
      ></app-vehicle-card>

      <div *ngIf="loading && vehicles.length === 0" class="flex flex-col gap-6">
        <div
          *ngFor="let s of [1, 2]"
          class="h-64 bg-surface-container rounded-2xl animate-pulse cursor-wait"
        ></div>
      </div>

      <p
        class="text-center font-semibold text-outline text-sm py-4 animate-pulse"
        *ngIf="loading && vehicles.length > 0"
      >
        Carregando...
      </p>

      <div
        class="flex flex-col items-center justify-center py-12 text-center"
        *ngIf="!loading && vehicles.length === 0"
      >
        <div
          class="w-16 h-16 bg-surface-container rounded-2xl flex items-center justify-center mb-4 text-outline border border-outline-variant/30"
        >
          <span class="material-symbols-outlined text-3xl font-light"
            >search_off</span
          >
        </div>
        <h2 class="font-bold text-on-surface text-lg mb-2">
          Nenhum veículo encontrado
        </h2>
        <p class="text-sm text-on-surface-variant max-w-[250px]">
          Tente remover alguns filtros ou buscar em outra cidade.
        </p>
      </div>
    </section>

    <!-- Sentinel -->
    <div
      #sentinel
      class="h-10 w-full opacity-0 pointer-events-none"
      *ngIf="hasNextPage && vehicles.length"
    ></div>
  </main>
  <app-filter-modal
    [open]="filtersOpen"
    [filters]="query"
    (close)="filtersOpen = false"
    (apply)="applyFilters($event)"
  />
</div>
