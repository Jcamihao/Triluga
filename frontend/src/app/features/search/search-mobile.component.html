<div class="bg-surface text-on-surface antialiased min-h-screen">
  <!-- TopAppBar -->
  <header
    class="sticky top-0 z-40 bg-surface/90 backdrop-blur-md flex justify-between items-center w-full px-6 py-4"
  >
    <div class="flex items-center gap-3">
      <button
        type="button"
        class="inline-flex items-center justify-center"
        aria-label="Abrir menu"
        (click)="toggleMenu()"
      >
        <span
          class="material-symbols-outlined text-primary scale-110 active:scale-95 transition-transform cursor-pointer"
          >menu</span
        >
      </button>
      <img src="assets/logo/logo-full.svg" alt="Triluga" class="h-9 w-auto" />
    </div>
    <div class="flex items-center gap-4">
      <button
        type="button"
        class="inline-flex items-center justify-center"
        aria-label="Abrir notificações"
        (click)="toggleNotifications()"
      >
        <span
          class="material-symbols-outlined text-on-surface-variant scale-110 active:scale-95 transition-transform cursor-pointer"
          >notifications</span
        >
      </button>
    </div>
  </header>
  <main class="pb-36">
    <!-- Compact Search & Filter Bar -->
    <section class="px-5 pt-4 mb-4">
      <div class="flex gap-2 items-center">
        <div
          class="flex-1 bg-surface-container-low rounded-xl px-4 flex items-center gap-3 border border-outline-variant/20 shadow-sm"
          style="height: 50px"
        >
          <span class="material-symbols-outlined text-outline text-lg"
            >search</span
          >
          <input
            aria-label="Buscar por modelo ou marca"
            class="bg-transparent border-none focus:ring-0 text-sm font-medium w-full text-on-surface placeholder:text-on-surface-variant/60"
            placeholder="Buscar por modelo ou marca"
            type="text"
            [value]="query.q || query.city"
            (keydown.enter)="onSearch({ q: $any($event.target).value })"
            style="
              height: 100%;
              border: none;
              padding: 0;
              margin: 0;
              outline: none;
              box-shadow: none;
            "
          />
        </div>
        <button
          aria-label="Abrir filtros"
          class="bg-primary text-on-primary rounded-xl flex items-center justify-center shadow-md shadow-primary/20 active:scale-95 transition-transform"
          (click)="filtersOpen = true"
          style="width: 45px; height: 45px"
        >
          <span class="material-symbols-outlined text-xl">tune</span>
        </button>
      </div>

      <!-- Location chip row -->
      <div class="flex gap-2 mt-2">
        <button
          *ngIf="!hasLocationFilter"
          type="button"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-outline-variant/40 bg-surface-container-low text-on-surface-variant text-xs font-semibold active:scale-95 transition-transform"
          (click)="useCurrentLocation()"
        >
          <span class="material-symbols-outlined text-[14px]">my_location</span>
          Perto de mim
        </button>
        <button
          *ngIf="hasLocationFilter"
          type="button"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-primary text-on-primary text-xs font-bold shadow shadow-primary/20 active:scale-95 transition-transform"
          (click)="clearLocationFilter()"
        >
          <span class="material-symbols-outlined text-[14px]" style="font-variation-settings:'FILL' 1">my_location</span>
          Raio de {{ query.radiusKm || '20' }} km
          <span class="material-symbols-outlined text-[12px]">close</span>
        </button>
      </div>
    </section>
    <!-- Refined Active Filter Chips -->
    <section
      class="px-5 mb-5 overflow-x-auto no-scrollbar"
      *ngIf="activeSearchPills.length > 0"
    >
      <div class="flex gap-2 whitespace-nowrap">
        <div
          *ngFor="let pill of activeSearchPills"
          class="bg-surface-container-high text-on-surface-variant px-3 py-1.5 rounded-full text-[11px] font-semibold flex items-center gap-1.5 border border-outline-variant/30"
          (click)="removeFilter(pill.key)"
          role="button"
          tabindex="0"
          [attr.aria-label]="'Remover filtro: ' + pill.label"
          (keydown.enter)="removeFilter(pill.key)"
          (keydown.space)="$event.preventDefault(); removeFilter(pill.key)"
        >
          {{ pill.label }}
          <span class="material-symbols-outlined text-xs">close</span>
        </div>
      </div>
    </section>
    <!-- Result Counter + Save Alert -->
    <section class="px-5 mb-4 flex justify-between items-center">
      <h2
        class="search-result-count text-on-surface font-extrabold tracking-tight leading-none whitespace-nowrap overflow-hidden text-ellipsis mr-2"
      >
        {{ totalItems }} {{ resultsLabel }}
      </h2>
      <div class="flex items-center gap-2 flex-shrink-0">
        <button
          *ngIf="hasActiveFilters"
          type="button"
          class="flex items-center gap-1 px-3 py-1.5 rounded-full border border-primary/30 bg-primary/5 text-primary font-bold text-[11px]"
          (click)="openSaveAlert()"
        >
          <span class="material-symbols-outlined text-[13px]">notifications_active</span>
          Salvar busca
        </button>
        <div class="relative">
          <button
            type="button"
            class="flex items-center gap-1 font-bold text-primary uppercase tracking-widest bg-primary/5 px-2 py-1 rounded"
            style="font-size: 10px"
            (click)="sortDropdownOpen = !sortDropdownOpen"
          >
            {{ activeSortLabel }}
            <span class="material-symbols-outlined text-primary transition-transform" style="font-size: 12px" [style.transform]="sortDropdownOpen ? 'rotate(180deg)' : 'rotate(0deg)'">expand_more</span>
          </button>
          <div
            *ngIf="sortDropdownOpen"
            class="absolute right-0 top-full mt-1 z-50 bg-surface rounded-xl shadow-xl border border-outline-variant/20 overflow-hidden min-w-[140px]"
          >
            <button
              *ngFor="let opt of sortOptions"
              type="button"
              class="w-full text-left px-4 py-3 text-sm font-semibold transition-colors"
              [ngClass]="query.sort === opt.value ? 'text-primary bg-primary/5' : 'text-on-surface hover:bg-surface-container-low'"
              (click)="selectSort(opt.value)"
            >
              {{ opt.label }}
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Save Alert Panel (mobile) -->
    <section *ngIf="saveAlertOpen" class="px-5 mb-4">
      <div class="bg-surface-container-lowest rounded-2xl border border-primary/20 p-4 flex flex-col gap-3">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-lg" style="font-variation-settings:'FILL' 1">notifications_active</span>
          <p class="text-sm font-bold text-on-surface">Salvar alerta de busca</p>
          <button aria-label="Fechar alerta" type="button" class="ml-auto" (click)="closeSaveAlert()">
            <span class="material-symbols-outlined text-on-surface-variant text-lg">close</span>
          </button>
        </div>
        <input
          aria-label="Nome do alerta (opcional)"
          class="w-full bg-surface-container-low border-none rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary/20"
          type="text"
          placeholder="Nome do alerta (opcional)"
          [(ngModel)]="alertTitle"
        />
        <ng-container *ngIf="!alertSavedFeedback">
          <button
            type="button"
            class="w-full py-3 rounded-full bg-primary text-white font-bold text-sm disabled:opacity-50"
            [disabled]="savingAlert"
            (click)="saveAlert()"
          >
            {{ savingAlert ? 'Salvando...' : 'Salvar busca' }}
          </button>
        </ng-container>
        <div *ngIf="alertSavedFeedback" class="flex items-center justify-center gap-2 text-emerald-600 font-bold text-sm py-1">
          <span class="material-symbols-outlined text-[18px]" style="font-variation-settings:'FILL' 1">check_circle</span>
          Alerta salvo com sucesso!
        </div>
      </div>
    </section>

    <!-- Vehicle List -->
    <section class="px-5 space-y-6">
      <app-vehicle-card
        *ngFor="let vehicle of vehicles"
        [vehicle]="vehicle"
      ></app-vehicle-card>

      <div *ngIf="loading && vehicles.length === 0" class="flex flex-col gap-6">
        <div
          *ngFor="let s of [1, 2]"
          class="h-64 bg-surface-container rounded-2xl animate-pulse cursor-wait"
        ></div>
      </div>

      <p
        class="text-center font-semibold text-outline text-sm py-4 animate-pulse"
        *ngIf="loading && vehicles.length > 0"
      >
        Carregando...
      </p>

      <div
        class="flex flex-col items-center justify-center py-12 text-center"
        *ngIf="!loading && vehicles.length === 0"
      >
        <div
          class="w-16 h-16 bg-surface-container rounded-2xl flex items-center justify-center mb-4 text-outline border border-outline-variant/30"
        >
          <span class="material-symbols-outlined text-3xl font-light"
            >search_off</span
          >
        </div>
        <h2 class="font-bold text-on-surface text-lg mb-2">
          Nenhum veículo encontrado
        </h2>
        <p class="text-sm text-on-surface-variant max-w-[250px]">
          Tente remover alguns filtros ou buscar em outra cidade.
        </p>
      </div>
    </section>

    <!-- Sentinel -->
    <div
      #sentinel
      class="h-10 w-full opacity-0 pointer-events-none"
      *ngIf="hasNextPage && vehicles.length"
    ></div>
  </main>
  <app-filter-modal
    [open]="filtersOpen"
    [filters]="query"
    (close)="filtersOpen = false"
    (apply)="applyFilters($event)"
  />
</div>
