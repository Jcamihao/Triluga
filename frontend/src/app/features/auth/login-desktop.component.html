<app-web-header [fixed]="true"></app-web-header>

<main class="login-web">
  <div class="login-web__ambient" aria-hidden="true">
    <div></div>
    <div></div>
  </div>

  <section class="login-web__card">
    <div class="login-web__heading">
      <h2>Bem-vindo de volta</h2>
      <p>Insira seus dados para acessar sua conta.</p>
    </div>

    <form class="login-web__form" (ngSubmit)="login()">
      <div class="login-web__feedback" *ngIf="feedback" role="alert">
        <span class="material-symbols-outlined">error</span>
        <span>{{ feedback }}</span>
      </div>

      <label class="login-web__field">
        <span>E-mail</span>
        <div>
          <span class="material-symbols-outlined">mail</span>
          <input
            name="webEmail"
            [(ngModel)]="email"
            placeholder="nome@exemplo.com"
            type="email"
            autocomplete="email"
            required
            [disabled]="loading"
          />
        </div>
      </label>

      <label class="login-web__field">
        <span>
          Senha
          <button type="button" (click)="showPasswordRecoveryMessage()">
            Esqueceu a senha?
          </button>
        </span>
        <div>
          <span class="material-symbols-outlined">lock</span>
          <input
            name="webPassword"
            [(ngModel)]="password"
            placeholder="••••••••"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            required
            [disabled]="loading"
          />
          <button
            type="button"
            class="login-web__password-toggle"
            aria-label="Alternar visibilidade da senha"
            (click)="showPassword = !showPassword"
          >
            <span class="material-symbols-outlined">
              {{ showPassword ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
      </label>

      <label class="login-web__remember">
        <input
          type="checkbox"
          name="rememberMe"
          [(ngModel)]="rememberMe"
          [disabled]="loading"
        />
        <span>Lembrar de mim por 30 dias</span>
      </label>

      <button class="login-web__submit" type="submit" [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <div class="login-web__divider">
      <span></span>
      <small>ou continue com</small>
      <span></span>
    </div>

    <p class="login-web__signup">
      Não tem uma conta?
      <a routerLink="/auth/register">Cadastre-se</a>
    </p>
  </section>
</main>
