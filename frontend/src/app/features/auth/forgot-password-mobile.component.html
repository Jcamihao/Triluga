<div class="bg-surface text-on-surface min-h-screen flex flex-col items-center overflow-x-hidden">

  <!-- TopAppBar -->
  <header class="bg-surface/80 backdrop-blur-xl fixed top-0 z-50 w-full flex items-center justify-between px-6 py-4 tonal-transition bg-surface-container-low">
    <div class="flex items-center gap-4">
      <button class="hover:opacity-80 transition-opacity scale-95 active:transition-all" type="button" routerLink="/auth/login">
        <span class="material-symbols-outlined text-primary">arrow_back</span>
      </button>
      <h1 class="font-inter font-bold tracking-tight text-lg text-primary">Recuperar senha</h1>
    </div>
    <img src="assets/logo/logo-full.svg" alt="Triluga" class="h-9 w-auto" />
  </header>

  <main class="w-full max-w-[390px] px-6 pt-24 pb-12 flex flex-col flex-grow">

    <!-- Brand icon -->
    <div class="mb-10 text-center">
      <div class="w-20 h-20 mx-auto mb-6 bg-gradient-to-br from-primary to-primary-container rounded-3xl flex items-center justify-center shadow-lg">
        <span class="material-symbols-outlined text-white text-4xl" style="font-variation-settings: 'FILL' 1">lock_reset</span>
      </div>
      <h2 class="text-3xl font-extrabold tracking-tighter text-on-surface mb-2">Esqueceu a senha?</h2>
      <p class="text-on-surface-variant font-medium">Informe seu e-mail e enviaremos as instruções para redefinir sua senha.</p>
    </div>

    <!-- Form / Success state -->
    <ng-container *ngIf="!submitted; else successState">
      <form class="flex flex-col gap-6" (ngSubmit)="submit()">

        <!-- Error feedback -->
        <div class="bg-error-container text-on-error-container px-4 py-3 rounded-lg flex items-center gap-3 border border-error/10"
             *ngIf="feedback && feedbackType === 'error'" role="alert">
          <span class="material-symbols-outlined text-error">error</span>
          <span class="text-sm font-medium">{{ feedback }}</span>
        </div>

        <!-- Email field -->
        <div class="flex flex-col gap-2">
          <label class="text-sm font-bold text-on-surface tracking-wide uppercase ml-1" for="fp-email">E-mail</label>
          <div class="relative group">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface/40 group-focus-within:text-primary transition-colors">mail</span>
            <input
              class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-on-surface/30 font-medium transition-all shadow-sm"
              id="fp-email"
              name="fp-email"
              [(ngModel)]="email"
              placeholder="seu@email.com"
              type="email"
              autocomplete="email"
              [disabled]="loading"
            />
          </div>
        </div>

        <button
          class="w-full bg-gradient-to-br from-primary to-primary-container text-white py-4 rounded-full font-bold text-lg shadow-lg active:scale-95 transition-all mt-4 disabled:opacity-60 disabled:grayscale"
          type="submit"
          [disabled]="loading || !email.trim()"
        >
          {{ loading ? 'Enviando...' : 'Enviar instruções' }}
        </button>
      </form>
    </ng-container>

    <ng-template #successState>
      <div class="flex flex-col items-center gap-6 py-8 text-center">
        <span class="material-symbols-outlined text-primary" style="font-size:4rem;font-variation-settings:'FILL' 1">mark_email_read</span>
        <p class="text-on-surface-variant font-medium leading-relaxed">{{ feedback }}</p>
        <a routerLink="/auth/login"
           class="w-full bg-gradient-to-br from-primary to-primary-container text-white py-4 rounded-full font-bold text-lg shadow-lg text-center block">
          Voltar para o login
        </a>
      </div>
    </ng-template>

    <p class="text-on-surface-variant font-medium text-center mt-8" *ngIf="!submitted">
      Lembrou a senha?
      <a class="text-primary font-bold ml-1 hover:underline" routerLink="/auth/login">Entrar</a>
    </p>
  </main>
</div>
