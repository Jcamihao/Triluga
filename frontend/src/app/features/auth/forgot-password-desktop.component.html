<app-web-header [fixed]="true"></app-web-header>

<main class="forgot-web">
  <div class="forgot-web__ambient" aria-hidden="true">
    <div></div>
    <div></div>
  </div>

  <section class="forgot-web__card">
    <div class="forgot-web__heading">
      <h2>Esqueceu a senha?</h2>
      <p>Informe seu e-mail e enviaremos as instruções para redefinir sua senha.</p>
    </div>

    <ng-container *ngIf="!submitted; else successState">
      <form class="forgot-web__form" (ngSubmit)="submit()">
        <div class="forgot-web__feedback forgot-web__feedback--error" *ngIf="feedback && feedbackType === 'error'" role="alert">
          <span class="material-symbols-outlined">error</span>
          <span>{{ feedback }}</span>
        </div>

        <label class="forgot-web__field">
          <span>E-mail</span>
          <div>
            <span class="material-symbols-outlined">mail</span>
            <input
              name="email"
              [(ngModel)]="email"
              placeholder="nome@exemplo.com"
              type="email"
              autocomplete="email"
              required
              [disabled]="loading"
            />
          </div>
        </label>

        <button class="forgot-web__submit" type="submit" [disabled]="loading || !email.trim()">
          {{ loading ? 'Enviando...' : 'Enviar instruções' }}
        </button>
      </form>
    </ng-container>

    <ng-template #successState>
      <div class="forgot-web__success">
        <span class="material-symbols-outlined forgot-web__success-icon">mark_email_read</span>
        <p>{{ feedback }}</p>
      </div>
    </ng-template>

    <p class="forgot-web__back">
      Lembrou a senha?
      <a routerLink="/auth/login">Voltar para o login</a>
    </p>
  </section>
</main>
