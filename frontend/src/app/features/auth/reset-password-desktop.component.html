<app-web-header [fixed]="true"></app-web-header>

<main class="reset-web">
  <div class="reset-web__ambient" aria-hidden="true">
    <div></div>
    <div></div>
  </div>

  <section class="reset-web__card">

    <!-- Token ausente -->
    <ng-container *ngIf="tokenMissing">
      <div class="reset-web__heading">
        <h2>Link inválido</h2>
        <p>Este link de redefinição de senha é inválido ou expirou.</p>
      </div>
      <a routerLink="/auth/forgot-password" class="reset-web__submit" style="display:block;text-align:center;text-decoration:none;">
        Solicitar novo link
      </a>
    </ng-container>

    <!-- Formulário -->
    <ng-container *ngIf="!tokenMissing && !submitted">
      <div class="reset-web__heading">
        <h2>Nova senha</h2>
        <p>Crie uma senha segura com pelo menos 8 caracteres.</p>
      </div>

      <form class="reset-web__form" (ngSubmit)="submit()">
        <div class="reset-web__feedback reset-web__feedback--error" *ngIf="feedback && feedbackType === 'error'" role="alert">
          <span class="material-symbols-outlined">error</span>
          <span>{{ feedback }}</span>
        </div>

        <label class="reset-web__field">
          <span>Nova senha</span>
          <div>
            <span class="material-symbols-outlined">lock</span>
            <input
              name="newPassword"
              [(ngModel)]="newPassword"
              placeholder="••••••••"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="new-password"
              required
              [disabled]="loading"
            />
            <button type="button" class="reset-web__password-toggle" (click)="showPassword = !showPassword" aria-label="Alternar visibilidade">
              <span class="material-symbols-outlined">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
          <small *ngIf="newPassword && newPassword.length < 8" class="reset-web__hint reset-web__hint--error">Mínimo 8 caracteres</small>
        </label>

        <label class="reset-web__field">
          <span>Confirmar senha</span>
          <div>
            <span class="material-symbols-outlined">lock_clock</span>
            <input
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              placeholder="••••••••"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="new-password"
              required
              [disabled]="loading"
            />
          </div>
          <small *ngIf="confirmPassword && !passwordsMatch" class="reset-web__hint reset-web__hint--error">As senhas não coincidem</small>
        </label>

        <button class="reset-web__submit" type="submit" [disabled]="loading || !isFormValid">
          {{ loading ? 'Salvando...' : 'Redefinir senha' }}
        </button>
      </form>
    </ng-container>

    <!-- Sucesso -->
    <ng-container *ngIf="submitted">
      <div class="reset-web__success">
        <span class="material-symbols-outlined reset-web__success-icon">check_circle</span>
        <h2>Senha redefinida!</h2>
        <p>{{ feedback }}</p>
        <a routerLink="/auth/login" class="reset-web__submit" style="display:block;text-align:center;text-decoration:none;">
          Fazer login
        </a>
      </div>
    </ng-container>

  </section>
</main>
