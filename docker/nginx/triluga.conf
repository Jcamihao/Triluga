# Redireciona todo HTTP para HTTPS
server {
    listen 80;
    server_name triluga.com.br www.triluga.com.br api.triluga.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend — triluga.com.br
server {
    listen 443 ssl;
    server_name triluga.com.br www.triluga.com.br;

    ssl_certificate     /etc/letsencrypt/live/triluga.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/triluga.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass         http://127.0.0.1:4202;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# Backend — api.triluga.com.br
server {
    listen 443 ssl;
    server_name api.triluga.com.br;

    ssl_certificate     /etc/letsencrypt/live/api.triluga.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.triluga.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # WebSocket (chat em tempo real)
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # REST API
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Upload de imagens (até 20MB)
        client_max_body_size 20m;
    }
}
