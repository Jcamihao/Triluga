name: CI

# Roda em todo push (qualquer branch) e em PRs direcionados ao master.
# O objetivo é falhar rápido antes que código quebrado chegue à produção.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Frontend
  # Valida TypeScript, templates Angular e budget de CSS.
  # O `ng build` já roda o compilador TypeScript strict + template checker,
  # então não precisamos de um passo separado de typecheck.
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build (TypeScript + templates + budget)
        run: npm run build

      - name: Auditoria de segurança
        run: npm audit --audit-level=high --omit=dev

  # ─────────────────────────────────────────────
  # JOB 2 — Backend
  # Valida schema Prisma, compila NestJS e roda ESLint (sem auto-fix).
  # ─────────────────────────────────────────────
  backend:
    name: Backend — build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar cliente Prisma
        run: npm run prisma:generate

      - name: Build (NestJS)
        run: npm run build

      - name: Lint (sem auto-fix)
        run: npm run lint:ci

      - name: Auditoria de segurança
        run: npm audit --audit-level=high --omit=dev
